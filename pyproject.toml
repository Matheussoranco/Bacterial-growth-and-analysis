[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bacterial-growth"
version = "2.0.0"
description = "Research prototype for predictive microbiology: growth kinetics modelling and species classification"
authors = [{ name = "Matheus Pullig Soranço de Carvalho" }]
license = { text = "MIT" }
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "numpy>=1.24,<3.0",
    "scipy>=1.11,<2.0",
    "pandas>=2.0,<3.0",
    "scikit-learn>=1.6,<2.0",
    "imbalanced-learn>=0.12,<1.0",
    "xgboost>=2.0,<3.0",
    "lightgbm>=4.3,<5.0",
    "optuna>=3.6,<5.0",
    "shap>=0.45,<1.0",
    "matplotlib>=3.8,<4.0",
    "joblib>=1.4,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
